name: Weekly Codebase Cleanup (Ollama)

on:
  schedule:
    - cron: '0 3 * * 6'  # Every Saturday at 3 AM
  workflow_dispatch:

jobs:
  cleanup:
    if: ${{ contains(fromJSON('["your-username", "trusted-collaborator"]'), github.actor) }}
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Code Cleanup with Ollama
        uses: andre-farias/jules-action-ollama@v1
        with:
          prompt: |
            Analyze this codebase and perform maintenance tasks:

            1. Dead Code Removal - unused variables, functions, classes
            2. Code Duplication - refactor into reusable functions
            3. Complexity Reduction - simplify overly complex functions
            4. Naming Improvements - unclear variable/function names
            5. Code Formatting - inconsistent indentation, organize imports

            Guidelines:
            - Make incremental, safe refactorings
            - Preserve existing functionality
            - Group related changes logically
            - Do not open a PR if no validated and impactful change exists.
          ollama_model: 'glm-5.1:cloud'
          auto_commit: true
          include_commit_log: true