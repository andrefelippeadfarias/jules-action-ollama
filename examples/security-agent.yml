name: Daily Security Scan (Ollama)

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 30

      - name: Security Scan with Ollama
        uses: ./jules-action-ollama
        with:
          prompt: |
            You are a security agent. Scan this codebase for vulnerabilities:

            CRITICAL (fix immediately):
            - Hardcoded secrets, API keys, passwords
            - SQL injection, command injection
            - Missing auth on sensitive endpoints
            - Insecure CORS configurations

            HIGH PRIORITY:
            - XSS, CSRF vulnerabilities
            - Insecure direct object references
            - Missing input validation
            - Weak cryptography

            MEDIUM:
            - Missing security headers
            - Verbose error messages leaking info
            - Missing rate limiting

            Rules:
            - Fix highest severity first
            - Keep changes under 100 lines per fix
            - Add comments explaining security implications
            - Generate a security score (0-100)
            - List all findings with severity, file, line, and fix
          ollama_model: 'glm-5.1:cloud'
          auto_commit: true
          include_last_commit: true