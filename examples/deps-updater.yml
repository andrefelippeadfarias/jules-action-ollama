name: Dependencies Updater (Ollama)

on:
  schedule:
    - cron: '0 6 * * 5'  # Every Friday at 6 AM
  workflow_dispatch:

jobs:
  update-deps:
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Update Dependencies with Ollama
        uses: ./jules-action-ollama
        with:
          prompt: |
            Analyze and update dependencies in this project:

            1. **Identify all dependency files** (package.json, requirements.txt, composer.json, etc.)
            2. **Check for outdated versions** - compare with latest stable releases
            3. **Check for known vulnerabilities** - CVEs in current versions
            4. **Update safely** - increment versions, run tests
            5. **Report changes** - list what was updated and why

            Rules:
            - Only update to stable releases (no alpha/beta)
            - Prefer minor/patch updates over major version jumps
            - If a major update is needed, note it but don't auto-apply
            - Run existing tests after updating
            - Group updates by risk level (patch < minor < major)
            - Only create PR if updates are safe and tests pass
          ollama_model: 'glm-5.1:cloud'
          auto_commit: true
          include_commit_log: true