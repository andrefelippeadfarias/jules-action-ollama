name: Dependencies Updater (Ollama)

on:
  schedule:
    - cron: '0 6 * * 5'  # Every Friday at 6 AM
  workflow_dispatch:

jobs:
  update-deps:
    if: ${{ contains(fromJSON('["your-username", "trusted-collaborator"]'), github.actor) }}
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Update Dependencies with Ollama
        uses: andre-farias/jules-action-ollama@v1
        with:
          prompt: |
            Analyze and update dependencies in this project:

            1. Identify all dependency files (package.json, requirements.txt, etc.)
            2. Check for outdated versions
            3. Check for known vulnerabilities (CVEs)
            4. Update safely - prefer minor/patch updates
            5. Report changes - list what was updated and why

            Rules:
            - Only update to stable releases (no alpha/beta)
            - Run existing tests after updating
            - Group updates by risk level
            - Only create PR if updates are safe and tests pass
          ollama_model: 'glm-5.1:cloud'
          auto_commit: false  # SECURITY: Review AI output before committing
          include_commit_log: true
