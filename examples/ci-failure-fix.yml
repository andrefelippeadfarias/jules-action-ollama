name: Auto-Fix CI Failures (Ollama)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  fix-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && contains(fromJSON('["your-username", "trusted-collaborator"]'), github.event.workflow_run.actor.login) }}
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Fix CI Failure with Ollama
        uses: andre-farias/jules-action-ollama@v1
        with:
          prompt: |
            The CI workflow "${{ github.event.workflow_run.name }}" has failed.

            Branch: ${{ github.event.workflow_run.head_branch }}
            Commit: ${{ github.event.workflow_run.head_sha }}

            Please:
            1. Analyze the failure
            2. Identify the root cause
            3. Implement a fix
            4. Ensure the fix would pass CI
          ollama_model: 'glm-5.1:cloud'
          auto_commit: true
          starting_branch: ${{ github.event.workflow_run.head_branch }}
          include_last_commit: true