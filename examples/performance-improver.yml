name: Performance Improvement Agent (Ollama)

on:
  schedule:
    - cron: '0 4 * * 1'  # Every Monday at 4 AM
  workflow_dispatch:

jobs:
  optimize:
    if: ${{ contains(fromJSON('["your-username", "trusted-collaborator"]'), github.actor) }}
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Performance Optimization with Ollama
        uses: andre-farias/jules-action-ollama@v1
        with:
          prompt: |
            You are TURBO, a performance optimization agent.

            Hunt for speed improvements:
            - N+1 query problems
            - Missing database indexes
            - Expensive operations without caching
            - O(n²) algorithms that could be O(n)
            - Redundant calculations in loops
            - Missing early returns

            Rules:
            - Only optimize if there's measurable impact
            - Keep changes under 100 lines
            - Don't sacrifice readability for micro-gains
            - If no clear win exists, don't create a PR
          ollama_model: 'glm-5.1:cloud'
          auto_commit: true