name: 'Jules Action Ollama'
description: 'Invoke a local Ollama-powered coding agent to perform tasks on your codebase. No API key needed - runs entirely on your machine.'
author: 'andre-farias'
branding:
  icon: 'cpu'
  color: 'orange'

inputs:
  prompt:
    description: 'The task description for the agent to perform'
    required: true
    type: string
  ollama_model:
    description: 'Ollama model to use (default: glm-5.1:cloud)'
    required: false
    type: string
    default: 'glm-5.1:cloud'
  ollama_url:
    description: 'Ollama API URL (default: http://localhost:11434)'
    required: false
    type: string
    default: 'http://localhost:11434'
  starting_branch:
    description: 'The branch to start from'
    required: false
    type: string
    default: 'main'
  include_last_commit:
    description: 'Include the last commit diff in context'
    required: false
    type: boolean
    default: false
  include_commit_log:
    description: 'Include recent commit history in context'
    required: false
    type: boolean
    default: false
  auto_commit:
    description: 'Automatically commit and create PR if changes are made (SECURITY: requires human review)'
    required: false
    type: boolean
    default: false
  max_files:
    description: 'Maximum number of source files to include in context'
    required: false
    type: number
    default: 50
  temperature:
    description: 'Ollama temperature (0.0-1.0, lower = more deterministic)'
    required: false
    type: number
    default: 0.3
  max_tokens:
    description: 'Maximum tokens for Ollama response'
    required: false
    type: number
    default: 8192

outputs:
  response:
    description: 'The agent response text'
  changes_made:
    description: 'Whether changes were committed (true/false)'
  pr_url:
    description: 'URL of the created PR (if auto_commit is true)'

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 30

    - name: Create initial prompt
      env:
        USER_PROMPT: ${{ inputs.prompt }}
      shell: bash
      run: |
        echo "$USER_PROMPT" > prompt.txt

    - name: Save last commit content
      if: ${{ inputs.include_last_commit == 'true' }}
      shell: bash
      run: |
        echo -e '\n\nContent of the latest commit (in the format of `git show`):' >> prompt.txt
        echo '```' >> prompt.txt
        git show >> prompt.txt
        echo '```' >> prompt.txt

    - name: Save git log
      if: ${{ inputs.include_commit_log == 'true' }}
      shell: bash
      run: |
        echo -e '\n\nLog of the last 20 commits (in the format of `git log --stat`):' >> prompt.txt
        echo '```' >> prompt.txt
        git log -20 --stat >> prompt.txt
        echo '```' >> prompt.txt

    - name: Collect repository context
      shell: bash
      env:
        MAX_FILES: ${{ inputs.max_files }}
      run: |
        # Add repo structure (EXCLUDE sensitive files)
        echo -e '\n\n## Repository Structure\n' >> prompt.txt
        find . -type f -not -path './.git/*' -not -path './node_modules/*' \
          -not -path './.venv/*' -not -path './dist/*' -not -path './__pycache__/*' \
          -not -name '.env' -not -name '.env.*' \
          -not -name '*.key' -not -name '*.pem' -not -name '*.p12' \
          -not -name '*secret*' -not -name '*credential*' -not -name '*token*' \
          -not -name '*password*' -not -name '*.jks' \
          | head -100 >> prompt.txt

        # Add source code files (EXCLUDE sensitive files)
        echo -e '\n\n## Source Code\n' >> prompt.txt
        count=0
        for f in $(find . -type f \( -name "*.py" -o -name "*.js" -o -name "*.ts" \
          -o -name "*.jsx" -o -name "*.tsx" -o -name "*.php" -o -name "*.html" \
          -o -name "*.css" -o -name "*.json" -o -name "*.yaml" -o -name "*.yml" \
          -o -name "*.sh" -o -name "*.ps1" -o -name "*.sql" -o -name "*.md" \) \
          -not -path './.git/*' -not -path './node_modules/*' \
          -not -path './.venv/*' -not -path './dist/*' \
          -not -path './__pycache__/*' -not -path './coverage/*' \
          -not -path './package-lock.json' -not -path './yarn.lock' \
          -not -name '*.min.*' -not -name '.env' -not -name '.env.*' \
          -not -name '*.key' -not -name '*.pem' \
          | head -"$MAX_FILES"); do
          if [ -f "$f" ]; then
            size=$(wc -c < "$f" 2>/dev/null || echo 0)
            if [ "$size" -lt 50000 ]; then
              echo -e "\n### $f\n" >> prompt.txt
              echo '```' >> prompt.txt
              cat "$f" >> prompt.txt
              echo '```' >> prompt.txt
              count=$((count + 1))
            fi
          fi
        done
        echo "Included $count source files in context"

    - name: Invoke Ollama Agent
      id: ollama
      shell: bash
      env:
        OLLAMA_URL: ${{ inputs.ollama_url }}
        OLLAMA_MODEL: ${{ inputs.ollama_model }}
        TEMPERATURE: ${{ inputs.temperature }}
        MAX_TOKENS: ${{ inputs.max_tokens }}
      run: |
        # SECURITY: Use python3 for proper JSON serialization
        python3 -c "
        import json, sys
        with open('prompt.txt', 'r', encoding='utf-8') as f:
            prompt = f.read()
        payload = {
            'model': '$OLLAMA_MODEL',
            'prompt': prompt,
            'stream': False,
            'options': {
                'temperature': $TEMPERATURE,
                'num_predict': $MAX_TOKENS
            }
        }
        with open('payload.json', 'w', encoding='utf-8') as f:
            json.dump(payload, f, ensure_ascii=False)
        " || { echo "Failed to serialize JSON payload"; exit 1; }

        # Call Ollama API with timeout
        HTTP_CODE=$(curl -s -w "%{http_code}" -o ollama_raw.json --max-time 600 --connect-timeout 30 \
          "${OLLAMA_URL}/api/generate" \
          -H "Content-Type: application/json" \
          -d @payload.json)

        if [ "$HTTP_CODE" != "200" ]; then
          echo "❌ Ollama API returned HTTP $HTTP_CODE"
          cat ollama_raw.json 2>/dev/null
          exit 1
        fi

        # Extract response (handles GLM thinking mode)
        python3 -c "
        import json, sys
        with open('ollama_raw.json', 'r', encoding='utf-8') as f:
            data = json.load(f)
        output = ''
        if data.get('response', '').strip():
            output = data['response']
        elif data.get('thinking', '').strip():
            output = data['thinking']
        else:
            output = json.dumps(data, indent=2)
        with open('ollama_response.md', 'w', encoding='utf-8') as f:
            f.write(output)
        print(f'Tokens: {data.get(\"eval_count\", \"unknown\")}')
        print(f'Length: {len(output)} chars')
        " || { echo "Failed to parse Ollama response"; exit 1; }

        # Set output
        echo "response<<OEOF" >> $GITHUB_OUTPUT
        cat ollama_response.md >> $GITHUB_OUTPUT
        echo "OEOF" >> $GITHUB_OUTPUT

        # SECURITY: Clean up sensitive files
        rm -f prompt.txt payload.json ollama_raw.json
        echo "🧹 Cleaned up temporary files"

    - name: Create Pull Request
      if: ${{ inputs.auto_commit == 'true' }}
      shell: bash
      env:
        STARTING_BRANCH: ${{ inputs.starting_branch }}
      run: |
        # Check if there are changes to commit
        git diff --quiet && echo "No changes to commit" && exit 0

        # SECURITY: Sanitize title
        TITLE=$(head -1 ollama_response.md | tr -cd '[:alnum:] [:punct:].' | head -c 72)

        # Create branch
        BRANCH="jules-$(date +%Y%m%d-%H%M%S)"
        git checkout -b "$BRANCH"

        # Commit changes
        git add -A
        git commit -m "🤒 Auto-fix: ${TITLE}"

        # Push
        git push origin "$BRANCH"

        # SECURITY: Use --body-file instead of interpolating body
        PR_URL=$(gh pr create \
          --base "$STARTING_BRANCH" \
          --head "$BRANCH" \
          --title "🤒 ${TITLE}" \
          --body-file ollama_response.md 2>&1)

        echo "pr_url=${PR_URL}" >> $GITHUB_OUTPUT
        echo "changes_made=true" >> $GITHUB_OUTPUT
        echo "✅ PR created: ${PR_URL}"

        # SECURITY: Clean up response file
        rm -f ollama_response.md