name: Test Security Scan (Ollama)

on:
  workflow_dispatch:

jobs:
  test-ollama:
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Check Ollama is running
        shell: bash
        run: |
          if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
            echo "✅ Ollama is running"
            curl -s http://localhost:11434/api/tags | python3 -c "import sys,json; data=json.load(sys.stdin); print('Models:', ', '.join([m['name'] for m in data.get('models',[])]))"
          else
            echo "❌ Ollama is not running. Please start Ollama first."
            exit 1
          fi

      - name: Collect Repository Context
        shell: bash
        run: |
          # Create prompt
          cat > prompt.txt << 'PROMPT'
          You are a security agent. Analyze this repository for vulnerabilities.

          Check for:
          1. Hardcoded secrets, API keys, passwords
          2. SQL injection, XSS, CSRF
          3. Missing authentication
          4. Insecure configurations
          5. Dependency vulnerabilities

          Generate a security score (0-100) and list all findings.
          PROMPT

          # Add repo structure
          echo -e "\n\n## Repository Structure\n" >> prompt.txt
          find . -type f -not -path './.git/*' -not -path './node_modules/*' | head -50 >> prompt.txt

          # Add source files
          echo -e "\n\n## Source Code\n" >> prompt.txt
          for f in $(find . -type f \( -name "*.yaml" -o -name "*.yml" -o -name "*.md" -o -name "*.sh" \) -not -path './.git/*' | head -20); do
            if [ -f "$f" ]; then
              echo -e "\n### $f\n" >> prompt.txt
              echo '```' >> prompt.txt
              cat "$f" >> prompt.txt
              echo '```' >> prompt.txt
            fi
          done

          echo "Prompt file created: $(wc -l < prompt.txt) lines"

      - name: Invoke Ollama Agent
        shell: bash
        run: |
          PROMPT=$(cat prompt.txt)
          
          RESPONSE=$(curl -s --max-time 300 "http://localhost:11434/api/generate" -d "${PROMPT}" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"glm-5.1:cloud\",\"prompt\":$(python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))' < prompt.txt),\"stream\":false,\"options\":{\"temperature\":0.3,\"num_predict\":2048}}")
          
          echo "$RESPONSE" | python3 -c 'import sys,json; print(json.load(sys.stdin)["response"])' > ollama_response.md
          echo "✅ Ollama response received"
          echo "Tokens: $(echo "$RESPONSE" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("eval_count","unknown"))' 2>/dev/null || echo 'unknown')"

      - name: Display Results
        shell: bash
        run: |
          echo "=== SECURITY SCAN RESULTS ==="
          cat ollama_response.md