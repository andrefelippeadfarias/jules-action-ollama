name: Test Security Scan (Ollama)

on:
  workflow_dispatch:

jobs:
  test-ollama:
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Check Ollama is running
        shell: powershell
        run: |
          try {
            $resp = Invoke-RestMethod -Uri "http://localhost:11434/api/tags" -Method Get -TimeoutSec 10
            Write-Output "Ollama is running. Models: $($resp.models.name -join ', ')"
          } catch {
            Write-Output "Ollama is not running on localhost:11434"
            Write-Output "Error: $($_.Exception.Message)"
            exit 1
          }

      - name: Collect Repository Context
        shell: powershell
        run: |
          $prompt = @"
          You are a security agent. Analyze this repository for vulnerabilities.

          Check for:
          1. Hardcoded secrets, API keys, passwords
          2. SQL injection, XSS, CSRF
          3. Missing authentication
          4. Insecure configurations
          5. Dependency vulnerabilities

          Generate a security score (0-100) and list all findings.
          "@

          # Add repo structure
          $prompt += "`n`n## Repository Structure`n"
          $files = Get-ChildItem -Recurse -File | Where-Object { $_.FullName -notmatch '\\\.git\\' -and $_.FullName -notmatch '\\node_modules\\' } | Select-Object -First 50
          foreach ($f in $files) {
            $prompt += "`n$($f.FullName.Replace($PWD.Path, '.'))"
          }

          # Add source files
          $prompt += "`n`n## Source Code`n"
          $sourceFiles = Get-ChildItem -Recurse -File | Where-Object { $_.Extension -match '\.(yaml|yml|md|sh|ps1|json)$' -and $_.FullName -notmatch '\\\.git\\' } | Select-Object -First 20
          foreach ($f in $sourceFiles) {
            $relPath = $f.FullName.Replace($PWD.Path, '.')
            $prompt += "`n`n### $relPath`n"
            $prompt += "```"
            $content = Get-Content $f.FullName -Raw -ErrorAction SilentlyContinue
            if ($content) { $prompt += $content }
            $prompt += "```"
          }

          $prompt | Out-File -FilePath prompt.txt -Encoding UTF8
          Write-Output "Prompt file created"

      - name: Invoke Ollama Agent
        shell: powershell
        run: |
          $promptContent = Get-Content prompt.txt -Raw
          $body = @{
            model = "glm-5.1:cloud"
            prompt = $promptContent
            stream = $false
            options = @{
              temperature = 0.3
              num_predict = 2048
            }
          } | ConvertTo-Json -Depth 5

          $resp = Invoke-RestMethod -Uri "http://localhost:11434/api/generate" -Method Post -ContentType "application/json" -Body $body -TimeoutSec 300

          $resp.response | Out-File -FilePath ollama_response.md -Encoding UTF8
          Write-Output "Ollama response received"
          Write-Output "Tokens: $($resp.eval_count)"

      - name: Display Results
        shell: powershell
        run: |
          Write-Output "=== SECURITY SCAN RESULTS ==="
          Get-Content ollama_response.md