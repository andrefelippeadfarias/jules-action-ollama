name: Test Security Scan (Ollama)

on:
  workflow_dispatch:

jobs:
  test-ollama:
    # SECURITY: Restrict who can trigger
    if: ${{ contains(fromJSON('["andrefelippeadfarias"]'), github.actor) }}
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Security Scan
        shell: powershell
        run: |
          .\scripts\test-security-ollama.ps1